<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="1920" height="1080">
  <defs>
    <radialGradient id="bg" cx="38%" cy="38%" r="85%">
      <stop offset="0" stop-color="#172b4d"/>
      <stop offset="0.55" stop-color="#14203a"/>
      <stop offset="1" stop-color="#121626"/>
    </radialGradient>
    <radialGradient id="purple" cx="85%" cy="85%" r="55%">
      <stop offset="0" stop-color="#3a1f55" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3a1f55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.9"/>
    </linearGradient>
    <mask id="floorMask">
      <rect x="0" y="780" width="1920" height="300" fill="url(#floorFade)"/>
    </mask>
    <filter id="blurFar" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Isometric cube (unit 100) -->
    <g id="cube" stroke-linejoin="round">
      <polygon points="0,-100 86.6,-50 0,0 -86.6,-50" fill="#22d3ee" fill-opacity="0.32" stroke="#67e8f9" stroke-opacity="0.85" stroke-width="2"/>
      <polygon points="-86.6,-50 0,0 0,100 -86.6,50" fill="#1e3a6e" fill-opacity="0.35" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2"/>
      <polygon points="86.6,-50 0,0 0,100 86.6,50" fill="#7c3aed" fill-opacity="0.3" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="2"/>
    </g>
  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#purple)"/>

  <!-- Drifting light blobs -->
  <circle r="420" fill="url(#cyanGlow)">
    <animate attributeName="cx" values="500;900;500" dur="22s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="380;520;380" dur="26s" repeatCount="indefinite"/>
  </circle>
  <circle r="360" fill="url(#cyanGlow)" opacity="0.7">
    <animate attributeName="cx" values="1500;1150;1500" dur="28s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="260;420;260" dur="24s" repeatCount="indefinite"/>
  </circle>

  <!-- Perspective floor grid -->
  <g mask="url(#floorMask)" stroke="#22d3ee" fill="none">
    <g stroke-opacity="0.55" stroke-width="1.5">
      <line x1="960" y1="780" x2="-1800" y2="1080"/><line x1="960" y1="780" x2="-1300" y2="1080"/>
      <line x1="960" y1="780" x2="-800" y2="1080"/><line x1="960" y1="780" x2="-400" y2="1080"/>
      <line x1="960" y1="780" x2="-100" y2="1080"/><line x1="960" y1="780" x2="200" y2="1080"/>
      <line x1="960" y1="780" x2="480" y2="1080"/><line x1="960" y1="780" x2="720" y2="1080"/>
      <line x1="960" y1="780" x2="960" y2="1080"/>
      <line x1="960" y1="780" x2="1200" y2="1080"/><line x1="960" y1="780" x2="1440" y2="1080"/>
      <line x1="960" y1="780" x2="1720" y2="1080"/><line x1="960" y1="780" x2="2020" y2="1080"/>
      <line x1="960" y1="780" x2="2400" y2="1080"/><line x1="960" y1="780" x2="2900" y2="1080"/>
      <line x1="960" y1="780" x2="3400" y2="1080"/><line x1="960" y1="780" x2="3900" y2="1080"/>
    </g>
    <g stroke-opacity="0.6">
      <line x1="0" x2="1920" y1="780" y2="780" stroke-width="1">
        <animate attributeName="y1" values="780;1080" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 0.9 0.5" dur="6s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="780;1080" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 0.9 0.5" dur="6s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="0.5;2.5" dur="6s" repeatCount="indefinite"/>
      </line>
      <line x1="0" x2="1920" y1="780" y2="780" stroke-width="1">
        <animate attributeName="y1" values="780;1080" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 0.9 0.5" dur="6s" begin="-1s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="780;1080" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 0.9 0.5" dur="6s" begin="-1s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="0.5;2.5" dur="6s" begin="-1s" repeatCount="indefinite"/>
      </line>
      <line x1="0" x2="1920" y1="780" y2="780" stroke-width="1">
        <animate attributeName="y1" values="780;1080" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 0.9 0.5" dur="6s" begin="-2s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="780;1080" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 0.9 0.5" dur="6s" begin="-2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="0.5;2.5" dur="6s" begin="-2s" repeatCount="indefinite"/>
      </line>
      <line x1="0" x2="1920" y1="780" y2="780" stroke-width="1">
        <animate attributeName="y1" values="780;1080" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 0.9 0.5" dur="6s" begin="-3s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="780;1080" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 0.9 0.5" dur="6s" begin="-3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="0.5;2.5" dur="6s" begin="-3s" repeatCount="indefinite"/>
      </line>
      <line x1="0" x2="1920" y1="780" y2="780" stroke-width="1">
        <animate attributeName="y1" values="780;1080" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 0.9 0.5" dur="6s" begin="-4s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="780;1080" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 0.9 0.5" dur="6s" begin="-4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="0.5;2.5" dur="6s" begin="-4s" repeatCount="indefinite"/>
      </line>
      <line x1="0" x2="1920" y1="780" y2="780" stroke-width="1">
        <animate attributeName="y1" values="780;1080" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 0.9 0.5" dur="6s" begin="-5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="780;1080" keyTimes="0;1" calcMode="spline" keySplines="0.6 0 0.9 0.5" dur="6s" begin="-5s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="0.5;2.5" dur="6s" begin="-5s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- Floating isometric cubes (far = small + blurred, near = big) -->
  <g>
    <g transform="translate(1390,150) scale(0.35)" opacity="0.55" filter="url(#blurFar)">
      <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-30;0,0" dur="7s" repeatCount="indefinite"/><use href="#cube"/></g>
    </g>
    <g transform="translate(120,600) scale(0.4)" opacity="0.5" filter="url(#blurFar)">
      <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-26;0,0" dur="8s" begin="-2s" repeatCount="indefinite"/><use href="#cube"/></g>
    </g>
    <g transform="translate(1640,250) scale(0.75)" filter="url(#glow)">
      <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-36;0,0" dur="9s" repeatCount="indefinite"/>
        <g><animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="9s" repeatCount="indefinite"/><use href="#cube"/></g></g>
    </g>
    <g transform="translate(340,330) scale(0.5)" opacity="0.8" filter="url(#glow)">
      <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-30;0,0" dur="10s" begin="-4s" repeatCount="indefinite"/><use href="#cube"/></g>
    </g>
    <g transform="translate(1760,760) scale(1.15)" opacity="0.9" filter="url(#glow)">
      <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-44;0,0" dur="11s" begin="-3s" repeatCount="indefinite"/><use href="#cube"/></g>
    </g>
    <g transform="translate(230,870) scale(0.95)" opacity="0.9" filter="url(#glow)">
      <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-40;0,0" dur="12s" begin="-6s" repeatCount="indefinite"/><use href="#cube"/></g>
    </g>
  </g>

  <!-- Rising bits -->
  <g fill="#67e8f9">
    <circle cx="260" cy="1000" r="3"><animate attributeName="cy" values="1080;-20" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="1000" r="2"><animate attributeName="cy" values="1080;-20" dur="17s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="17s" begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="1000" r="3"><animate attributeName="cy" values="1080;-20" dur="15s" begin="-9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="15s" begin="-9s" repeatCount="indefinite"/></circle>
    <circle cx="1380" cy="1000" r="2"><animate attributeName="cy" values="1080;-20" dur="18s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="18s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="1560" cy="1000" r="3"><animate attributeName="cy" values="1080;-20" dur="13s" begin="-7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="13s" begin="-7s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="1000" r="2"><animate attributeName="cy" values="1080;-20" dur="19s" begin="-11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="19s" begin="-11s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Soft vignette to keep text readable -->
  <rect width="1920" height="1080" fill="#0b1020" opacity="0.18"/>
</svg>

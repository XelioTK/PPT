<text x="380" y="287" font-size="13" fill="#94a3b8" text-anchor="middle">batería</text>
<text x="380" y="305" font-size="16" fill="#e2e8f0" text-anchor="middle" opacity="1"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;1" values="1;0;0"/>A y B arriba (0) → circuito abierto → apagado</text>
<text x="380" y="305" font-size="16" fill="#e2e8f0" text-anchor="middle" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.5;1" values="0;1;0;0"/>A bajó (1), pero B sigue arriba → apagado</text>
<text x="380" y="305" font-size="16" fill="#22c55e" text-anchor="middle" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0;0.5;0.75;1" values="0;1;0;0"/>A y B abajo (1) → circuito cerrado → enciende</text>
<text x="380" y="305" font-size="16" fill="#e2e8f0" text-anchor="middle" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0;0.75;1" values="0;1;0"/>A volvió a abrirse → se apaga</text>
